meters:
  - name: netscaler_instance_license
    description: Per-instance NetScaler edition + throughput-tier license.
    unit: instance-month
    aggregation: max
    dimensions:
      - edition
      - throughput_tier
      - form_factor
      - region
  - name: netscaler_pooled_bandwidth
    description: Pooled bandwidth allocated across NetScaler instances under Pooled Capacity.
    unit: Mbps-month
    aggregation: max
    dimensions:
      - region
  - name: netscaler_pooled_ssl_tps
    description: Pooled SSL transactions-per-second under Pooled Capacity.
    unit: TPS-month
    aggregation: max
    dimensions:
      - region
  - name: netscaler_console_management
    description: NetScaler Console (ADM) management capacity (managed instances / agents).
    unit: instance-month
    aggregation: max
    dimensions:
      - tier
      - region
  - name: hyperscaler_compute
    description: Underlying VM / container compute for VPX / CPX deployments.
    unit: instance-hour
    aggregation: sum
    dimensions:
      - cloud
      - instance_type
      - region
principles:
  - name: Visibility
    description: Use NetScaler Console (ADM) for license-pool consumption, throughput, and SSL TPS
      utilization; pair with hyperscaler cost reports for VPX / CPX compute.
  - name: Allocation
    description: Allocate appliance license cost to platform / network team budgets; chargeback by
      virtual server / tenant using ADM analytics tags.
  - name: Optimization
    description: Move to Pooled Capacity to share bandwidth across MPX / VPX / SDX / CPX, retire
      under-utilized appliances, choose the right edition (Standard vs Premium), and prefer reserved
      / savings-plan commitments for hyperscaler compute hosting VPX.
  - name: Accountability
    description: Network / platform owner is accountable for NetScaler license-pool sizing,
      term-renewal cadence, and coordination with cloud platform teams on the underlying compute.
