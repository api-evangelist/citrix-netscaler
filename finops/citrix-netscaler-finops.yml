description: >-
  FOCUS-aligned FinOps shape for NetScaler. Cost is driven by NetScaler edition (Standard / Advanced
  / Premium), throughput tier, and form factor (MPX / VPX / SDX / CPX), increasingly delivered via
  pooled-capacity subscriptions managed by NetScaler Console. Underlying compute / network for VPX /
  CPX instances is billed by the hosting hyperscaler or on-prem hypervisor.
notes: Underlying compute / network for virtual NetScaler instances on AWS / Azure / GCP / on-prem
  is billed separately by those providers and tracked through their FinOps surfaces.
