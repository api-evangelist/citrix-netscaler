specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Citrix NetScaler
providerId: citrix-netscaler
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Application Delivery Controller
  - Load Balancing
  - Web Application Firewall
  - API Gateway
  - Traffic Management
description: >-
  NetScaler (Cloud Software Group, formerly Citrix ADC) is sold by edition and form factor: NetScaler
  ADC Standard / Advanced / Premium editions, packaged as MPX (hardware), VPX (virtual appliance),
  SDX (multi-tenant chassis), CPX (containerized), and NetScaler Console / ADM (management plane).
  Pricing is partner-quote and varies by throughput tier (e.g. 200 Mbps to 100 Gbps), perpetual vs
  subscription, and pooled-capacity bundles. The NITRO REST API is bundled with the parent
  appliance / subscription.
notes: No public per-instance price list. Replace with negotiated list pricing once available from a
  NetScaler authorized partner.
sources:
  - https://www.netscaler.com
  - https://docs.netscaler.com
  - https://www.citrix.com/products/citrix-app-delivery-and-security/
plans:
  - id: citrix-netscaler-standard
    name: NetScaler ADC Standard
    type: subscription
    description: Entry edition with core load balancing, SSL offload, GSLB, and content switching.
      Sold per appliance / VPX / throughput tier.
    entries:
      - label: Per appliance / VPX / throughput tier
        name: standard
        type: subscription
        metric: instance
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: contact NetScaler authorized partner
        userMultiplied: false
    elements:
      - name: Layer 4-7 load balancing
      - name: SSL / TLS offload
      - name: GSLB
      - name: NITRO REST API
  - id: citrix-netscaler-advanced
    name: NetScaler ADC Advanced
    type: subscription
    description: Adds caching, application firewall (WAF), API security, and bot management to
      Standard.
    entries:
      - label: Per appliance / VPX / throughput tier
        name: advanced
        type: subscription
        metric: instance
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: contact NetScaler authorized partner
        userMultiplied: false
    elements:
      - name: WAF
      - name: API gateway / security
      - name: Bot management
      - name: AppExpert / rewrite policies
  - id: citrix-netscaler-premium
    name: NetScaler ADC Premium
    type: subscription
    description: Top edition with full content optimization, advanced WAF rules, integrated caching,
      and policy automation.
    entries:
      - label: Per appliance / VPX / throughput tier
        name: premium
        type: subscription
        metric: instance
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: contact NetScaler authorized partner
        userMultiplied: false
    elements:
      - name: All Advanced features
      - name: Integrated caching / front-end optimization
      - name: Advanced WAF / OWASP coverage
      - name: NetScaler Console premium analytics
  - id: citrix-netscaler-pooled-capacity
    name: NetScaler Pooled Capacity
    type: subscription
    description: Buy total Mbps / Gbps and SSL TPS as pooled licenses; allocate dynamically across
      MPX / VPX / SDX / CPX instances.
    entries:
      - label: Pooled bandwidth / SSL TPS
        name: pooled
        type: subscription
        metric: bandwidth
        limit: -1
        timeFrame: year
        geo: global
        unit: 1
        price: contact NetScaler authorized partner
        userMultiplied: false
    elements:
      - name: Pooled bandwidth across all form factors
      - name: Pooled SSL TPS
      - name: Centralized license server (NetScaler Console)
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
