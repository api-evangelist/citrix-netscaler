naftiko: 1.0.0-alpha2
info:
  label: Citrix NetScaler ADC Management
  description: Unified capability for managing Citrix NetScaler application delivery controllers, including load balancing,
    content switching, configuration management, and monitoring. Used by network administrators and platform engineers.
  tags:
  - Citrix
  - NetScaler
  - Load Balancing
  - ADC Management
  - Network Administration
  created: '2026-04-18'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    NETSCALER_USERNAME: NETSCALER_USERNAME
    NETSCALER_PASSWORD: NETSCALER_PASSWORD
capability:
  consumes:
  - type: http
    namespace: nitro
    baseUri: https://{nsip}/nitro/v1
    description: Citrix NetScaler NITRO REST API for ADC management
    authentication:
      type: basic
      username: '{{NETSCALER_USERNAME}}'
      password: '{{NETSCALER_PASSWORD}}'
    resources:
    - name: authentication
      path: /config
      description: Session-based authentication for the NITRO API
      operations:
      - name: login
        method: POST
        description: Log in to the NetScaler appliance and obtain session token
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            login:
              username: '{{tools.username}}'
              password: '{{tools.password}}'
      - name: logout
        method: POST
        description: Log out from the NetScaler appliance
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            logout: {}
    - name: ns-config
      path: /config
      description: NetScaler appliance configuration management
      operations:
      - name: get-ns-config
        method: GET
        description: Get NetScaler configuration
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: update-ns-config
        method: PUT
        description: Update NetScaler configuration
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            nsconfig: '{{tools.config}}'
      - name: save-ns-config
        method: POST
        description: Save NetScaler configuration to disk
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: clear-ns-config
        method: POST
        description: Clear NetScaler configuration
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            nsconfig: '{{tools.config}}'
    - name: system-files
      path: /config
      description: System file management
      operations:
      - name: list-system-files
        method: GET
        description: List system files on the appliance
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: upload-system-file
        method: POST
        description: Upload a system file to the appliance
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            systemfile: '{{tools.file}}'
      - name: delete-system-file
        method: DELETE
        description: Delete a system file from the appliance
        inputParameters:
        - name: filename
          in: path
          type: string
          required: true
          description: Name of the file to delete
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: lb-vservers
      path: /config
      description: Load balancing virtual server management
      operations:
      - name: list-lb-vservers
        method: GET
        description: List all load balancing virtual servers
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-lb-vserver
        method: POST
        description: Create a load balancing virtual server
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            lbvserver: '{{tools.vserver}}'
      - name: get-lb-vserver
        method: GET
        description: Get a specific load balancing virtual server
        inputParameters:
        - name: name
          in: path
          type: string
          required: true
          description: Name of the LB virtual server
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: update-lb-vserver
        method: PUT
        description: Update a load balancing virtual server
        inputParameters:
        - name: name
          in: path
          type: string
          required: true
          description: Name of the LB virtual server
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            lbvserver: '{{tools.vserver}}'
      - name: delete-lb-vserver
        method: DELETE
        description: Delete a load balancing virtual server
        inputParameters:
        - name: name
          in: path
          type: string
          required: true
          description: Name of the LB virtual server
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: lb-service-bindings
      path: /config
      description: Load balancing virtual server service binding management
      operations:
      - name: bind-service-to-lb-vserver
        method: POST
        description: Bind a service to a load balancing virtual server
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            lbvserver_service_binding: '{{tools.binding}}'
      - name: get-lb-vserver-service-bindings
        method: GET
        description: Get service bindings for a load balancing virtual server
        inputParameters:
        - name: name
          in: path
          type: string
          required: true
          description: Name of the LB virtual server
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: unbind-service-from-lb-vserver
        method: DELETE
        description: Unbind a service from a load balancing virtual server
        inputParameters:
        - name: name
          in: path
          type: string
          required: true
          description: Name of the LB virtual server
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: cs-vservers
      path: /config
      description: Content switching virtual server management
      operations:
      - name: list-cs-vservers
        method: GET
        description: List all content switching virtual servers
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-cs-vserver
        method: POST
        description: Create a content switching virtual server
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            csvserver: '{{tools.vserver}}'
      - name: get-cs-vserver
        method: GET
        description: Get a specific content switching virtual server
        inputParameters:
        - name: name
          in: path
          type: string
          required: true
          description: Name of the CS virtual server
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: update-cs-vserver
        method: PUT
        description: Update a content switching virtual server
        inputParameters:
        - name: name
          in: path
          type: string
          required: true
          description: Name of the CS virtual server
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            csvserver: '{{tools.vserver}}'
      - name: delete-cs-vserver
        method: DELETE
        description: Delete a content switching virtual server
        inputParameters:
        - name: name
          in: path
          type: string
          required: true
          description: Name of the CS virtual server
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: cs-policy-bindings
      path: /config
      description: Content switching policy binding management
      operations:
      - name: bind-cs-policy-to-cs-vserver
        method: POST
        description: Bind a content switching policy to a CS virtual server
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            csvserver_cspolicy_binding: '{{tools.binding}}'
      - name: get-cs-vserver-policy-bindings
        method: GET
        description: Get policy bindings for a content switching virtual server
        inputParameters:
        - name: name
          in: path
          type: string
          required: true
          description: Name of the CS virtual server
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: statistics
      path: /stat
      description: Performance and health statistics
      operations:
      - name: list-lb-vserver-stats
        method: GET
        description: List statistics for all load balancing virtual servers
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-lb-vserver-stats
        method: GET
        description: Get statistics for a specific load balancing virtual server
        inputParameters:
        - name: name
          in: path
          type: string
          required: true
          description: Name of the LB virtual server
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: list-cs-vserver-stats
        method: GET
        description: List statistics for all content switching virtual servers
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: get-cs-vserver-stats
        method: GET
        description: Get statistics for a specific content switching virtual server
        inputParameters:
        - name: name
          in: path
          type: string
          required: true
          description: Name of the CS virtual server
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: adc-management-api
    description: Unified REST API for Citrix NetScaler ADC management.
    resources:
    - path: /v1/lb-vservers
      name: lb-vservers
      description: Load balancing virtual servers
      operations:
      - method: GET
        name: list-lb-vservers
        description: List all load balancing virtual servers
        call: nitro.list-lb-vservers
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: create-lb-vserver
        description: Create a load balancing virtual server
        call: nitro.create-lb-vserver
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/lb-vservers/{name}
      name: lb-vserver
      description: Single load balancing virtual server
      operations:
      - method: GET
        name: get-lb-vserver
        description: Get a specific load balancing virtual server
        call: nitro.get-lb-vserver
        with:
          name: rest.name
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: update-lb-vserver
        description: Update a load balancing virtual server
        call: nitro.update-lb-vserver
        with:
          name: rest.name
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: delete-lb-vserver
        description: Delete a load balancing virtual server
        call: nitro.delete-lb-vserver
        with:
          name: rest.name
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/lb-vservers/{name}/bindings
      name: lb-vserver-bindings
      description: Service bindings for a load balancing virtual server
      operations:
      - method: GET
        name: get-lb-vserver-service-bindings
        description: Get service bindings for an LB virtual server
        call: nitro.get-lb-vserver-service-bindings
        with:
          name: rest.name
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: bind-service-to-lb-vserver
        description: Bind a service to an LB virtual server
        call: nitro.bind-service-to-lb-vserver
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/cs-vservers
      name: cs-vservers
      description: Content switching virtual servers
      operations:
      - method: GET
        name: list-cs-vservers
        description: List all content switching virtual servers
        call: nitro.list-cs-vservers
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: create-cs-vserver
        description: Create a content switching virtual server
        call: nitro.create-cs-vserver
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/cs-vservers/{name}
      name: cs-vserver
      description: Single content switching virtual server
      operations:
      - method: GET
        name: get-cs-vserver
        description: Get a content switching virtual server
        call: nitro.get-cs-vserver
        with:
          name: rest.name
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: update-cs-vserver
        description: Update a content switching virtual server
        call: nitro.update-cs-vserver
        with:
          name: rest.name
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: delete-cs-vserver
        description: Delete a content switching virtual server
        call: nitro.delete-cs-vserver
        with:
          name: rest.name
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/config
      name: config
      description: Appliance configuration
      operations:
      - method: GET
        name: get-ns-config
        description: Get NetScaler configuration
        call: nitro.get-ns-config
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: save-ns-config
        description: Save running configuration to disk
        call: nitro.save-ns-config
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/stats/lb-vservers
      name: lb-vserver-stats
      description: Load balancing virtual server statistics
      operations:
      - method: GET
        name: list-lb-vserver-stats
        description: List statistics for all LB virtual servers
        call: nitro.list-lb-vserver-stats
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/stats/lb-vservers/{name}
      name: lb-vserver-stats-detail
      description: Statistics for a specific LB virtual server
      operations:
      - method: GET
        name: get-lb-vserver-stats
        description: Get statistics for an LB virtual server
        call: nitro.get-lb-vserver-stats
        with:
          name: rest.name
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/stats/cs-vservers
      name: cs-vserver-stats
      description: Content switching virtual server statistics
      operations:
      - method: GET
        name: list-cs-vserver-stats
        description: List statistics for all CS virtual servers
        call: nitro.list-cs-vserver-stats
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: adc-management-mcp
    transport: http
    description: MCP server for AI-assisted Citrix NetScaler ADC management.
    tools:
    - name: list-lb-vservers
      description: List all load balancing virtual servers on the NetScaler
      hints:
        readOnly: true
        openWorld: true
      call: nitro.list-lb-vservers
      outputParameters:
      - type: object
        mapping: $.
    - name: create-lb-vserver
      description: Create a new load balancing virtual server
      hints:
        readOnly: false
      call: nitro.create-lb-vserver
      with:
        vserver: tools.vserver
      outputParameters:
      - type: object
        mapping: $.
    - name: get-lb-vserver
      description: Get details of a specific load balancing virtual server
      hints:
        readOnly: true
        openWorld: true
      call: nitro.get-lb-vserver
      with:
        name: tools.name
      outputParameters:
      - type: object
        mapping: $.
    - name: update-lb-vserver
      description: Update a load balancing virtual server configuration
      hints:
        readOnly: false
        idempotent: true
      call: nitro.update-lb-vserver
      with:
        name: tools.name
        vserver: tools.vserver
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-lb-vserver
      description: Delete a load balancing virtual server
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: nitro.delete-lb-vserver
      with:
        name: tools.name
      outputParameters:
      - type: object
        mapping: $.
    - name: bind-service-to-lb-vserver
      description: Bind a backend service to a load balancing virtual server
      hints:
        readOnly: false
      call: nitro.bind-service-to-lb-vserver
      with:
        binding: tools.binding
      outputParameters:
      - type: object
        mapping: $.
    - name: get-lb-vserver-service-bindings
      description: Get all service bindings for a load balancing virtual server
      hints:
        readOnly: true
        openWorld: true
      call: nitro.get-lb-vserver-service-bindings
      with:
        name: tools.name
      outputParameters:
      - type: object
        mapping: $.
    - name: unbind-service-from-lb-vserver
      description: Unbind a service from a load balancing virtual server
      hints:
        readOnly: false
        destructive: true
      call: nitro.unbind-service-from-lb-vserver
      with:
        name: tools.name
      outputParameters:
      - type: object
        mapping: $.
    - name: list-cs-vservers
      description: List all content switching virtual servers
      hints:
        readOnly: true
        openWorld: true
      call: nitro.list-cs-vservers
      outputParameters:
      - type: object
        mapping: $.
    - name: create-cs-vserver
      description: Create a content switching virtual server
      hints:
        readOnly: false
      call: nitro.create-cs-vserver
      with:
        vserver: tools.vserver
      outputParameters:
      - type: object
        mapping: $.
    - name: get-cs-vserver
      description: Get details of a specific content switching virtual server
      hints:
        readOnly: true
        openWorld: true
      call: nitro.get-cs-vserver
      with:
        name: tools.name
      outputParameters:
      - type: object
        mapping: $.
    - name: update-cs-vserver
      description: Update a content switching virtual server
      hints:
        readOnly: false
        idempotent: true
      call: nitro.update-cs-vserver
      with:
        name: tools.name
        vserver: tools.vserver
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-cs-vserver
      description: Delete a content switching virtual server
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: nitro.delete-cs-vserver
      with:
        name: tools.name
      outputParameters:
      - type: object
        mapping: $.
    - name: get-ns-config
      description: Get NetScaler appliance configuration
      hints:
        readOnly: true
        openWorld: true
      call: nitro.get-ns-config
      outputParameters:
      - type: object
        mapping: $.
    - name: save-ns-config
      description: Save the running NetScaler configuration to persistent storage
      hints:
        readOnly: false
      call: nitro.save-ns-config
      outputParameters:
      - type: object
        mapping: $.
    - name: list-lb-vserver-stats
      description: List performance statistics for all LB virtual servers
      hints:
        readOnly: true
        openWorld: true
      call: nitro.list-lb-vserver-stats
      outputParameters:
      - type: object
        mapping: $.
    - name: get-lb-vserver-stats
      description: Get performance statistics for a specific LB virtual server
      hints:
        readOnly: true
        openWorld: true
      call: nitro.get-lb-vserver-stats
      with:
        name: tools.name
      outputParameters:
      - type: object
        mapping: $.
    - name: list-cs-vserver-stats
      description: List statistics for all content switching virtual servers
      hints:
        readOnly: true
        openWorld: true
      call: nitro.list-cs-vserver-stats
      outputParameters:
      - type: object
        mapping: $.
    - name: get-cs-vserver-stats
      description: Get statistics for a specific content switching virtual server
      hints:
        readOnly: true
        openWorld: true
      call: nitro.get-cs-vserver-stats
      with:
        name: tools.name
      outputParameters:
      - type: object
        mapping: $.
