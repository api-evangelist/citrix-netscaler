        labelledconn:
          type: number
          description: >-
            Total labeled connections.

    SystemFile:
      type: object
      description: >-
        A system file on the NetScaler appliance.
      properties:
        filename:
          type: string
          description: >-
            Name of the file.
        filelocation:
          type: string
          description: >-
            Location of the file on the appliance filesystem
            (e.g., /nsconfig/ssl).
        filecontent:
          type: string
          description: >-
            Base64-encoded file content. Used when uploading files.
        fileencoding:
          type: string
          description: >-
            Encoding of the file content.
          enum:
            - BASE64
        fileaccesstime:
          type: string
          description: >-
            Last access time of the file.
          readOnly: true
        filemodifiedtime:
          type: string
          description: >-
            Last modification time of the file.
          readOnly: true
        filemode:
          type: string
          description: >-
            File permissions mode.
          readOnly: true
        filesize:
          type: integer
          description: >-
            Size of the file in bytes.
          readOnly: true
