                      totalresponses: 42.5
                      responsesrate: 42.5
                      totalrequestbytes: 42.5
                      totalresponsebytes: 42.5
                      totalpktsrecvd: 42.5
                      totalpktssent: 42.5
                      totspillovers: 42.5
                      labelledconn: 42.5
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Content switching virtual server not found.

      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  securitySchemes:
    nitroAuthToken:
      type: apiKey
      in: cookie
      name: NITRO_AUTH_TOKEN
      description: >-
        Session-based authentication token obtained via the /config/login
        endpoint. Provided as a cookie with each request.
    nitroBasicAuth:
      type: apiKey
      in: header
      name: X-NITRO-USER
      description: >-
        Per-request authentication using X-NITRO-USER and X-NITRO-PASS
        headers as an alternative to session-based tokens.

  parameters:
    Attrs:
      name: attrs
      in: query
      description: >-
        Comma-separated list of attributes to retrieve. Limits the response
        to only the specified fields for efficiency.
      schema:
        type: string
      example: name,ipv46,port,servicetype
    Filter:
      name: filter
      in: query
      description: >-
        Filter expression in the format property1:value1,property2:value2
        to restrict results to matching resources.
      schema:
        type: string
      example: servicetype:HTTP,lbmethod:ROUNDROBIN
    View:
      name: view
      in: query
      description: >-
        Controls the level of detail in the response. Summary returns a
        minimal set of properties; detail returns all properties.
      schema:
        type: string
        enum:
        - summary
        - detail
    Count:
      name: count
      in: query
      description: >-
        When set to yes, returns only the count of matching resources
        instead of the full resource details.
      schema:
        type: string
        enum:
        - 'yes'
        - 'no'
    PageSize:
      name: pagesize
      in: query
      description: >-
        Number of resources to return per page for paginated responses.
      schema:
        type: integer
        minimum: 1
    PageNo:
      name: pageno
      in: query
      description: >-
        Page number to retrieve in paginated responses.
      schema:
        type: integer
        minimum: 1
    BulkErrorHandling:
      name: X-NITRO-ONERROR
      in: header
      description: >-
        Controls error handling for bulk operations. CONTINUE proceeds
        with remaining items, EXIT stops on first error, ROLLBACK
        reverts all changes on any error.
      schema:
        type: string
        enum:
        - CONTINUE
        - EXIT
        - ROLLBACK

  responses:
    Unauthorized:
      description: >-
        Authentication required. Provide a valid NITRO_AUTH_TOKEN cookie
        or X-NITRO-USER/X-NITRO-PASS headers.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NitroErrorResponse'
    BadRequest:
      description: >-
        Invalid request. Check the request body for missing required
        fields or invalid values.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NitroErrorResponse'

  schemas:
    NitroResponse:
      type: object
      description: Standard NITRO API success response.
      properties:
        errorcode:
          type: integer
          description: >-
            Error code. 0 indicates success.
          examples:
          - 0
        message:
          type: string
          description: >-
            Human-readable message describing the result.
          examples:
          - Done
        severity:
          type: string
          description: >-
            Severity level of the response.
          enum:
          - NONE
          - ERROR
          - WARNING

          example: NONE
    NitroErrorResponse:
      type: object
      description: NITRO API error response with details about the failure.
      properties:
        errorcode:
          type: integer
          description: >-
            Numeric error code identifying the specific error.
          example: 10
        message:
          type: string
          description: >-
            Human-readable error message.
          example: example_value
        severity:
          type: string
          description: >-
            Severity level of the error.
          enum:
          - ERROR
          - WARNING

          example: ERROR
    NsConfig:
      type: object
      description: >-
        NetScaler appliance configuration including network settings,
        system parameters, and operational options.
      properties:
        ipaddress:
          type: string
          description: >-
            The NetScaler IP (NSIP) address of the appliance. This is the
            primary management IP address.
          format: ipv4
          example: example_value
        netmask:
          type: string
          description: >-
            Subnet mask associated with the NSIP address.
          format: ipv4
          example: example_value
        nsvlan:
          type: integer
          description: >-
            VLAN ID for the NSIP address. Range 2-4094.
          minimum: 2
          maximum: 4094
          example: 10
        ifnum:
          type: string
          description: >-
            Network interfaces bound to the NSVLAN. Format is
            slot/port (e.g., 1/1).
          example: example_value
        tagged:
          type: string
          description: >-
            Whether the NSVLAN is tagged or untagged.
          enum:
          - 'YES'
          - 'NO'
          example: 'YES'
        httpport:
          type: array
          description: >-
            HTTP port(s) on the appliance. Default is 80.
          items:
            type: integer
          example: []
        maxconn:
          type: integer
          description: >-
            Maximum number of connections per service. Zero means
            unlimited.
          minimum: 0
          example: 10
        maxreq:
          type: integer
          description: >-
            Maximum number of requests per connection. Zero means
            unlimited.
          minimum: 0
          example: 10
        cip:
          type: string
          description: >-
            Whether to insert the client IP address into the HTTP
            header of requests forwarded to the service.
          enum:
          - ENABLED
          - DISABLED
          example: ENABLED
        cipheader:
          type: string
          description: >-
            Name of the HTTP header used to insert the client IP
            address when CIP is enabled.
          example: example_value
        cookieversion:
          type: string
          description: >-
            Version of the cookie inserted by the NetScaler for
            persistence.
          enum:
          - '0'
          - '1'
          example: '0'
        securecookie:
          type: string
          description: >-
            Whether the secure flag is set on persistence cookies.
          enum:
          - ENABLED
          - DISABLED
          example: ENABLED
        pmtumin:
          type: integer
          description: >-
            Minimum path MTU value. Range 168-1500.
          minimum: 168
          maximum: 1500
          example: 10
        pmtutimeout:
          type: integer
          description: >-
            Timeout in minutes for path MTU discovery. Range 1-1440.
          minimum: 1
          maximum: 1440
          example: 10
        ftpportrange:
          type: string
          description: >-
            Port range for FTP data connections (e.g., 1024-65535).
          example: example_value
        timezone:
          type: string
          description: >-
            Time zone setting for the appliance (e.g.,
            GMT+05:30-IST-Asia/Kolkata).
          example: example_value
        grantquotamaxclient:
          type: integer
          description: >-
            Percentage of shared quota to be granted at a time for
            max client connections.
          example: 10
        grantquotaspillover:
          type: integer
          description: >-
            Percentage of shared quota to be granted at a time for
            spillover threshold.
          example: 10
        crportrange:
          type: string
          description: >-
            Port range for cache redirection.
          example: example_value
        systemtype:
          type: string
          description: >-
            The type of the NetScaler appliance.
          readOnly: true
          enum:
          - Stand-alone
          - HA-Primary
          - HA-Secondary
          example: Stand-alone
        primaryip:
          type: string
          description: >-
            Primary IP address of the HA pair.
          readOnly: true
          format: ipv4
          example: example_value
        primaryip6:
          type: string
          description: >-
            Primary IPv6 address of the HA pair.
          readOnly: true
          format: ipv6
          example: example_value
        flags:
          type: integer
          description: >-
            Internal flags for the configuration.
          readOnly: true
          example: 10
        lastconfigchangedtime:
          type: string
          description: >-
            Timestamp of the last configuration change.
          readOnly: true
          example: example_value
        lastconfigsavetime:
          type: string
          description: >-
            Timestamp of the last configuration save.
          readOnly: true
          example: example_value
        currentsytemtime:
          type: string
          description: >-
            Current system time on the appliance.
          readOnly: true
          example: example_value
        systemtime:
          type: integer
          description: >-
            Current system time as epoch seconds.
          readOnly: true
          example: 10
        configchanged:
          type: boolean
          description: >-
            Whether the running configuration has unsaved changes.
          readOnly: true
          example: true
        mappedip:
          type: string
          description: >-
            Mapped IP address for the NSIP.
          format: ipv4
          example: example_value
        range:
          type: integer
          description: >-
            Number of consecutive IP addresses in the range
            beginning with the mapped IP.
          minimum: 1

          example: 10
    LbVserver:
      type: object
      description: >-
        A load balancing virtual server configuration that accepts incoming
        client traffic and distributes it across bound backend services
        using a configured load balancing algorithm.
      required:
      - name
      - servicetype
      properties:
        name:
          type: string
          description: >-
            Name for the load balancing virtual server. Must be unique and
            begin with a letter, number, or underscore. Maximum 127
            characters.
          minLength: 1
          maxLength: 127
          example: Example Title
        servicetype:
          type: string
          description: >-
            Protocol of the service running on the virtual server.
          enum:
          - HTTP
          - FTP
          - TCP
          - UDP
          - SSL
          - SSL_BRIDGE
          - SSL_TCP
          - DTLS
          - NNTP
          - DNS
          - DHCPRA
          - ANY
          - SIP_UDP
          - SIP_TCP
          - SIP_SSL
          - DNS_TCP
          - RTSP
          - PUSH
          - SSL_PUSH
          - RADIUS
          - RDP
          - MYSQL
          - MSSQL
          - DIAMETER
          - SSL_DIAMETER
          - TFTP
          - ORACLE
          - SMPP
          - SYSLOGTCP
          - SYSLOGUDP
          - FIX
          - SSL_FIX
          - PROXY
          - USER_TCP
          - USER_SSL_TCP
          - QUIC
          - IPFIX
          - LOGSTREAM
          - MONGO
          - MONGO_TLS
          - MQTT
          - MQTT_TLS
          - QUIC_BRIDGE
          - HTTP_QUIC
          example: HTTP
        ipv46:
          type: string
          description: >-
            IPv4 or IPv6 address to assign to the virtual server. Usually
            a VIP address on the NetScaler used as the entry point for
            client traffic.
          example: example_value
        port:
          type: integer
          description: >-
            Port number on which the virtual server listens.
          minimum: 0
          maximum: 65535
          example: 10
        ipset:
          type: string
          description: >-
            Name of the IP set to bind to the virtual server. Provides
            multiple IPs for the virtual server.
          example: example_value
        range:
          type: integer
          description: >-
            Number of IP addresses that the appliance must generate using
            the virtual server VIP address and the netmask. Range 2-254.
          minimum: 2
          maximum: 254
          example: 10
        ippattern:
          type: string
          description: >-
            IP address pattern for identifying packets to be accepted by
            the virtual server. Used with ipmask.
          example: example_value
        ipmask:
          type: string
          description: >-
            IP address mask with the IP pattern to form an IP address
            range for the virtual server.
          example: example_value
        td:
          type: integer
          description: >-
            Traffic domain identifier. Isolates traffic across virtual
            servers. Range 0-4094.
          minimum: 0
          maximum: 4094
          example: 10
        lbmethod:
          type: string
          description: >-
            Load balancing method used to select the backend service
            for each client request.
          enum:
          - ROUNDROBIN
          - LEASTCONNECTION
          - LEASTRESPONSETIME
          - URLHASH
          - DOMAINHASH
          - DESTINATIONIPHASH
          - SOURCEIPHASH
          - SRCIPDESTIPHASH
          - LEASTBANDWIDTH
          - LEASTPACKETS
          - TOKEN
          - SRCIPSRCPORTHASH
          - LRTM
          - CALLIDHASH
          - CUSTOMLOAD
          - LEASTREQUEST
          - AUDITLOGHASH
          - STATICPROXIMITY
          default: LEASTCONNECTION
          example: ROUNDROBIN
        hashlength:
          type: integer
          description: >-
            Number of bytes to use for the hash value in hash-based
            load balancing methods. Range 1-4096.
          minimum: 1
          maximum: 4096
          default: 80
          example: 10
        netmask:
          type: string
          description: >-
            IPv4 subnet mask for hashing in SOURCEIPHASH,
            DESTINATIONIPHASH, and SRCIPDESTIPHASH methods.
          example: example_value
        v6netmasklen:
          type: integer
          description: >-
            Number of bits in the IPv6 prefix for hash-based LB
            methods. Range 1-128.
          minimum: 1
          maximum: 128
          default: 128
          example: 10
        backuplbmethod:
          type: string
          description: >-
            Backup load balancing method used when the primary method
            fails to select a service.
          enum:
          - ROUNDROBIN
          - LEASTCONNECTION
          - LEASTRESPONSETIME
          - SOURCEIPHASH
          - CUSTOMLOAD
          default: ROUNDROBIN
          example: ROUNDROBIN
        persistencetype:
          type: string
          description: >-
            Type of persistence for the virtual server. Ensures
            requests from the same client go to the same service.
          enum:
          - SOURCEIP
          - COOKIEINSERT
          - SSLSESSION
          - RULE
          - URLPASSIVE
          - CUSTOMSERVERID
          - DESTIP
          - SRCIPDESTIP
          - CALLID
          - RTSPSID
          - DIAMETER
          - FIXSESSION
          - USERSESSION
          - NONE
          example: SOURCEIP
        persistmask:
          type: string
          description: >-
            IPv4 netmask for source IP persistence. Applied to the
            source IP before matching for persistence.
          example: example_value
        v6persistmasklen:
          type: integer
          description: >-
            IPv6 prefix length for source IP persistence. Range 1-128.
          minimum: 1
          maximum: 128
          default: 128
          example: 10
        persistencebackup:
          type: string
          description: >-
            Backup persistence type for the virtual server.
          enum:
          - SOURCEIP
          - NONE
          example: SOURCEIP
        timeout:
          type: integer
          description: >-
            Persistence timeout in minutes. The period for which
            persistence sessions are maintained. Range 0-1440.
          minimum: 0
          maximum: 1440
          default: 2
          example: 10
        persistavpno:
          type: array
          description: >-
            AVP numbers to use for Diameter persistence.
          items:
            type: integer
          example: []
        cookiename:
          type: string
          description: >-
            Name of the cookie generated by the NetScaler for cookie
            insert persistence.
          example: example_value
        rule:
          type: string
          description: >-
            Expression or name of a named expression that the virtual
            server uses to evaluate client requests. Default is true.
          default: '"none"'
          example: example_value
        listenpolicy:
          type: string
          description: >-
            Expression identifying traffic accepted by the virtual
            server. Default is NONE.
          default: NONE
          example: example_value
        listenpriority:
          type: integer
          description: >-
            Priority of the listen policy. Range 0-100.
          minimum: 0
          maximum: 100
          default: 101
          example: 10
        resrule:
          type: string
          description: >-
            Expression specifying which response to send when the
            virtual server matches the client request rule.
          default: '"none"'
          example: example_value
        push:
          type: string
          description: >-
            Process traffic with the push virtual server bound to
            this virtual server.
          enum:
          - ENABLED
          - DISABLED
          default: DISABLED
          example: ENABLED
        pushlabel:
          type: string
          description: >-
            Expression for extracting a label from the request. Used
            by the push virtual server.
          example: example_value
        pushmulticlients:
          type: string
          description: >-
            Allow multiple clients to connect to the push virtual
            server.
          enum:
          - 'YES'
          - 'NO'
          default: 'NO'
          example: 'YES'
        comment:
          type: string
          description: >-
            Informational description or comments about the virtual
            server.
          example: example_value
        clttimeout:
          type: integer
          description: >-
            Client idle timeout in seconds. Time to wait before
            closing an idle client connection. Range 0-31536000.
          minimum: 0
          maximum: 31536000
          example: 10
        somethod:
          type: string
          description: >-
            Spillover method. Defines the condition under which
            traffic spills over to the backup virtual server.
          enum:
          - CONNECTION
          - DYNAMICCONNECTION
          - BANDWIDTH
          - HEALTH
          - NONE
          example: CONNECTION
        sopersistence:
          type: string
          description: >-
            Whether to maintain persistence when spillover occurs.
          enum:
          - ENABLED
          - DISABLED
          default: DISABLED
          example: ENABLED
        sopersistencetimeout:
          type: integer
          description: >-
            Persistence timeout in minutes during spillover. Range
            2-1440.
          minimum: 2
          maximum: 1440
          default: 2
          example: 10
        sothreshold:
          type: integer
          description: >-
            Threshold value for the spillover method. Meaning varies
            based on somethod selected.
          minimum: 1
          example: 10
        healththreshold:
          type: integer
          description: >-
            Minimum percentage of UP services required to consider
            the virtual server as UP. Range 0-100.
          minimum: 0
          maximum: 100
          default: 0
          example: 10
        redirecturl:
          type: string
          description: >-
            URL to which requests are redirected when all services
            bound to the virtual server are DOWN.
          example: https://www.example.com
        downstateflush:
          type: string
          description: >-
            Flush all active transactions on all services bound to
            the virtual server when the state changes to DOWN.
          enum:
          - ENABLED
          - DISABLED
          default: ENABLED
          example: ENABLED
        disableprimaryondown:
          type: string
          description: >-
            When a virtual server goes DOWN, remain the primary
            virtual server in the HA pair so clients continue to
            connect.
          enum:
          - ENABLED
          - DISABLED
          default: DISABLED
          example: ENABLED
        insertvserveripport:
          type: string
          description: >-
            Insert the virtual server IP address and port in the
            request header.
          enum:
          - 'OFF'
          - VIPADDR
          - V6TOV4MAPPING
          example: 'OFF'
        vipheader:
          type: string
          description: >-
            Name of the HTTP header used to insert the virtual
            server IP and port.
          example: example_value
        authenticationhost:
          type: string
          description: >-
            FQDN of the authentication virtual server to which the
            user is redirected for authentication.
          example: example_value
        authentication:
          type: string
          description: >-
            Whether authentication is enabled for the virtual server.
          enum:
          - 'ON'
          - 'OFF'
          default: 'OFF'
          example: 'ON'
        authn401:
          type: string
          description: >-
            Whether to use HTTP 401-based authentication instead
            of redirect-based.
          enum:
          - 'ON'
          - 'OFF'
          default: 'OFF'
          example: 'ON'
        authnvsname:
          type: string
          description: >-
            Name of the authentication virtual server for 401-based
            authentication.
          example: example_value
        icmpvsrresponse:
          type: string
          description: >-
            How the NetScaler responds to ICMP ping requests sent
            to the VIP.
          enum:
          - PASSIVE
          - ACTIVE
          default: PASSIVE
          example: PASSIVE
        rhistate:
          type: string
          description: >-
            Route health injection state. Whether to advertise the
            route to the VIP via dynamic routing when the server
            is UP.
          enum:
          - PASSIVE
          - ACTIVE
          default: PASSIVE
          example: PASSIVE
        newservicerequest:
          type: integer
          description: >-
            Number of requests to accept on a new service before
            distributing traffic to all bound services. Range 0-100.
          minimum: 0
          maximum: 4294967294
          default: 0
          example: 10
        newservicerequestunit:
          type: string
          description: >-
            Unit for the newservicerequest parameter.
          enum:
          - PER_SECOND
          - PERCENT
          default: PER_SECOND
          example: PER_SECOND
        newservicerequestincrementinterval:
          type: integer
          description: >-
            Interval in seconds between successive increments for new
            service request rate. Range 0-3600.
          minimum: 0
          maximum: 3600
          default: 0
          example: 10
        minautoscalemembers:
          type: integer
          description: >-
            Minimum number of members for autoscale. Range 0-5000.
          minimum: 0
          maximum: 5000
          default: 0
          example: 10
        maxautoscalemembers:
          type: integer
          description: >-
            Maximum number of members for autoscale. Range 0-5000.
          minimum: 0
          maximum: 5000
          default: 0
          example: 10
        skippersistency:
          type: string
          description: >-
            Controls persistence behavior when selecting a service
            for certain virtual server types.
          enum:
          - Bypass
          - ReLb
          - None
          default: None
          example: Bypass
        appflowlog:
          type: string
          description: >-
            Whether to log AppFlow records for the virtual server.
          enum:
          - ENABLED
          - DISABLED
          default: ENABLED
          example: ENABLED
        state:
          type: string
          description: >-
            Administrative state of the virtual server.
          enum:
          - ENABLED
          - DISABLED
          default: ENABLED
          example: ENABLED
        connfailover:
          type: string
          description: >-
            Mode of connection failover for the virtual server in
            HA deployments.
          enum:
          - DISABLED
          - STATEFUL
          - STATELESS
          default: DISABLED
          example: DISABLED
        redirurl:
          type: string
          description: >-
            Redirect URL string configured on the virtual server.
          readOnly: true
          example: https://www.example.com
        curstate:
          type: string
          description: >-
            Current operational state of the virtual server.
          readOnly: true
          enum:
          - UP
          - DOWN
          - UNKNOWN
          - BUSY
          - OUT OF SERVICE
          - GOING OUT OF SERVICE
          - DOWN WHEN GOING OUT OF SERVICE
          - NS_EMPTY_STR
          example: UP
        effectivestate:
          type: string
          description: >-
            Effective state of the virtual server considering all
            factors.
          readOnly: true
          enum:
          - UP
          - DOWN
          - UNKNOWN
          - BUSY
          - OUT OF SERVICE
          - GOING OUT OF SERVICE
          - DOWN WHEN GOING OUT OF SERVICE
          - NS_EMPTY_STR
          example: UP
        status:
          type: integer
          description: >-
            Current status of the virtual server. 1 indicates UP.
          readOnly: true
          example: 10
        lbrrreason:
          type: integer
          description: >-
            Reason for the last load balancing redirection.
          readOnly: true
          example: 10
        totalservices:
          type: integer
          description: >-
            Total number of services bound to the virtual server.
          readOnly: true
          example: 10
        activeservices:
          type: integer
          description: >-
            Number of active (UP) services bound to the virtual
            server.
          readOnly: true
          example: 10
        statechangetimesec:
          type: string
          description: >-
            Time when the virtual server state last changed, in
            date-time format.
          readOnly: true
          example: example_value
        tickssincelaststatechange:
          type: integer
          description: >-
            Number of ticks since the last state change.
          readOnly: true
          example: 10
        health:
          type: integer
          description: >-
            Percentage of UP services to total bound services.
          readOnly: true
          example: 10
        isgslb:
          type: boolean
          description: >-
            Whether this virtual server is a GSLB virtual server.
          readOnly: true

          example: true
    CsVserver:
      type: object
      description: >-
        A content switching virtual server that directs client requests
        to different load balancing virtual servers based on content
        switching policies evaluating request attributes such as URL,
        HTTP header, or source IP address.
      required:
      - name
      - servicetype
      properties:
        name:
          type: string
          description: >-
            Name for the content switching virtual server. Must be
            unique and begin with a letter, number, or underscore.
            Maximum 127 characters.
          minLength: 1
          maxLength: 127
          example: Example Title
        td:
          type: integer
          description: >-
            Traffic domain identifier. Range 0-4094.
          minimum: 0
          maximum: 4094
          example: 10
        servicetype:
          type: string
          description: >-
            Protocol of the service running on the virtual server.
          enum:
          - HTTP
          - SSL
          - TCP
          - FTP
          - RTSP
          - SSL_TCP
          - UDP
          - DNS
          - SIP_UDP
          - SIP_TCP
          - SIP_SSL
          - ANY
          - RADIUS
          - RDP
          - MYSQL
          - MSSQL
          - DIAMETER
          - SSL_DIAMETER
          - DNS_TCP
          - ORACLE
          - SMPP
          - PROXY
          - MONGO
          - MONGO_TLS
          - MQTT
          - MQTT_TLS
          - HTTP_QUIC
          example: HTTP
        ipv46:
          type: string
          description: >-
            IPv4 or IPv6 address of the content switching virtual
            server.
          example: example_value
        port:
          type: integer
          description: >-
            Port number on which the content switching virtual server
            listens.
          minimum: 0
          maximum: 65535
          example: 10
        ipset:
          type: string
          description: >-
            Name of the IP set to bind to the virtual server.
          example: example_value
        range:
          type: integer
          description: >-
            Number of consecutive IP addresses for the virtual server.
            Range 2-254.
          minimum: 2
          maximum: 254
          example: 10
        ippattern:
          type: string
          description: >-
            IP address pattern for matching incoming requests.
          example: example_value
        ipmask:
          type: string
          description: >-
            IP mask applied with ippattern to form an address range.
          example: example_value
        stateupdate:
          type: string
          description: >-
            Whether the virtual server checks the backend server
            state for updates.
          enum:
          - ENABLED
          - DISABLED
          - UPDATEONBACKENDSTATEUP
          default: DISABLED
          example: ENABLED
        precedence:
          type: string
          description: >-
            Type of precedence for content switching policies.
            RULE means policies are evaluated in priority order.
            URL means URL-based switching takes precedence.
          enum:
          - RULE
          - URL
          example: RULE
        casesensitive:
          type: string
          description: >-
            Whether URL-based content switching is case sensitive.
          enum:
          - 'ON'
          - 'OFF'
          default: 'ON'
          example: 'ON'
        somethod:
          type: string
          description: >-
            Spillover method for the content switching virtual server.
          enum:
          - CONNECTION
          - DYNAMICCONNECTION
          - BANDWIDTH
          - HEALTH
          - NONE
          example: CONNECTION
        sopersistence:
          type: string
          description: >-
            Whether to maintain persistence during spillover.
          enum:
          - ENABLED
          - DISABLED
          default: DISABLED
          example: ENABLED
        sopersistencetimeout:
          type: integer
          description: >-
            Persistence timeout in minutes during spillover. Range
            2-1440.
          minimum: 2
          maximum: 1440
          default: 2
          example: 10
        sothreshold:
          type: integer
          description: >-
            Threshold value for the spillover method.
          minimum: 1
          example: 10
        redirecturl:
          type: string
          description: >-
            URL to redirect requests to when the virtual server is
            DOWN.
          example: https://www.example.com
        clttimeout:
          type: integer
          description: >-
            Client idle timeout in seconds. Range 0-31536000.
          minimum: 0
          maximum: 31536000
          example: 10
        downstateflush:
          type: string
          description: >-
            Flush all active transactions when the virtual server
            goes DOWN.
          enum:
          - ENABLED
          - DISABLED
          default: ENABLED
          example: ENABLED
        insertvserveripport:
          type: string
          description: >-
            Insert the virtual server VIP address and port into the
            HTTP header of the request.
          enum:
          - 'OFF'
          - VIPADDR
          - V6TOV4MAPPING
          example: 'OFF'
        vipheader:
          type: string
          description: >-
            Name of the HTTP header in which the VIP is inserted.
          example: example_value
        disableprimaryondown:
          type: string
          description: >-
            Continue to direct traffic to the virtual server even
            when DOWN in HA mode.
          enum:
          - ENABLED
          - DISABLED
          default: DISABLED
          example: ENABLED
        authentication:
          type: string
          description: >-
            Whether authentication is enabled for the virtual server.
          enum:
          - 'ON'
          - 'OFF'
          default: 'OFF'
          example: 'ON'
        authenticationhost:
          type: string
          description: >-
            FQDN of the authentication virtual server.
          example: example_value
        authn401:
          type: string
          description: >-
            Whether HTTP 401-based authentication is enabled.
          enum:
          - 'ON'
          - 'OFF'
          default: 'OFF'
          example: 'ON'
        authnvsname:
          type: string
          description: >-
            Name of the authentication virtual server.
          example: example_value
        push:
          type: string
          description: >-
            Whether push functionality is enabled.
          enum:
          - ENABLED
          - DISABLED
          default: DISABLED
          example: ENABLED
        pushlabel:
          type: string
          description: >-
            Expression for extracting a label from the request.
          example: example_value
        pushmulticlients:
          type: string
          description: >-
            Allow multiple clients to connect to the push vserver.
          enum:
          - 'YES'
          - 'NO'
          default: 'NO'
          example: 'YES'
        comment:
          type: string
          description: >-
            Description or comments about the content switching
            virtual server.
          example: example_value
        l2conn:
          type: string
          description: >-
            Whether Layer 2 connectivity is enabled between the
            client and server.
          enum:
          - 'ON'
          - 'OFF'
          example: 'ON'
        icmpvsrresponse:
          type: string
          description: >-
            How the appliance responds to ICMP ping requests for the
            VIP.
          enum:
          - PASSIVE
          - ACTIVE
          default: PASSIVE
          example: PASSIVE
        rhistate:
          type: string
          description: >-
            Route health injection state for the virtual server.
          enum:
          - PASSIVE
          - ACTIVE
          default: PASSIVE
          example: PASSIVE
        appflowlog:
          type: string
          description: >-
            Whether to log AppFlow records for the virtual server.
          enum:
          - ENABLED
          - DISABLED
          default: ENABLED
          example: ENABLED
        state:
          type: string
          description: >-
            Administrative state of the virtual server.
          enum:
          - ENABLED
          - DISABLED
          default: ENABLED
          example: ENABLED
        lbvserver:
          type: string
          description: >-
            Name of the default load balancing virtual server bound
            to this content switching virtual server. Requests that
            do not match any policy are sent here.
          example: example_value
        targetlbvserver:
          type: string
          description: >-
            Name of the target load balancing virtual server to which
            content is switched.
          example: example_value
        cachetype:
          type: string
          description: >-
            Cache type for integrated caching.
          enum:
          - TRANSPARENT
          - REVERSE
          - FORWARD
          example: TRANSPARENT
        redirect:
          type: string
          description: >-
            Type of cache redirect for the virtual server.
          enum:
          - CACHE
          - POLICY
          - ORIGIN
          example: CACHE
        curstate:
          type: string
          description: >-
            Current operational state of the virtual server.
          readOnly: true
          enum:
          - UP
          - DOWN
          - UNKNOWN
          - BUSY
          - OUT OF SERVICE
          - GOING OUT OF SERVICE
          - DOWN WHEN GOING OUT OF SERVICE
          - NS_EMPTY_STR
          example: UP
        status:
          type: integer
          description: >-
            Current status of the virtual server. 1 indicates UP.
          readOnly: true
          example: 10
        statechangetimesec:
          type: string
          description: >-
            Time when the virtual server state last changed.
          readOnly: true
          example: example_value
        tickssincelaststatechange:
          type: integer
          description: >-
            Number of ticks since the last state change.
          readOnly: true
          example: 10
        type:
          type: string
          description: >-
            Virtual server type (e.g., content-based or IP-address
            based).
          readOnly: true
          example: example_value
        ngname:
          type: string
          description: >-
            Node group name to which the virtual server is bound.
          readOnly: true
          example: example_value
        value:
          type: string
          description: >-
            The value of the IP address, based on the virtual server
            type.
          readOnly: true

          example: example_value
    LbVserverServiceBinding:
      type: object
      description: >-
        Binding between a load balancing virtual server and a backend
        service. This allows the virtual server to distribute traffic
        to the bound service.
      properties:
        name:
          type: string
          description: >-
            Name of the load balancing virtual server to which the
            service is bound.
          example: Example Title
        servicename:
          type: string
          description: >-
            Name of the service to bind to the virtual server.
          example: example_value
        weight:
          type: integer
          description: >-
            Weight assigned to the service for weighted load
            balancing. Range 1-100.
          minimum: 1
          maximum: 100
          example: 10
        servicetype:
          type: string
          description: >-
            Protocol type of the bound service.
          readOnly: true
          example: example_value
        curstate:
          type: string
          description: >-
            Current state of the bound service.
          readOnly: true
          example: example_value
        ipv46:
          type: string
          description: >-
            IP address of the bound service.
          readOnly: true
          example: example_value
        port:
          type: integer
          description: >-
            Port of the bound service.
          readOnly: true
          example: 10
        dynamicweight:
          type: integer
          description: >-
            Dynamic weight of the service based on server health.
          readOnly: true

          example: 10
    CsVserverCsPolicyBinding:
      type: object
      description: >-
        Binding between a content switching virtual server and a content
        switching policy. Defines how requests are evaluated and routed
        to target load balancing virtual servers.
      properties:
        name:
          type: string
          description: >-
            Name of the content switching virtual server.
          example: Example Title
        policyname:
          type: string
          description: >-
            Name of the content switching policy to bind.
          example: example_value
        targetlbvserver:
          type: string
          description: >-
            Name of the target load balancing virtual server to which
            matching traffic is directed.
          example: example_value
        priority:
          type: integer
          description: >-
            Priority of the policy binding. Lower values indicate
            higher priority.
          minimum: 1
          example: 10
        gotopriorityexpression:
          type: string
          description: >-
            Expression specifying the priority of the next policy
            to evaluate if the current policy matches.
          example: example_value
        bindpoint:
          type: string
          description: >-
            The bind point at which the policy is bound.
          enum:
          - REQUEST
          - RESPONSE
          - ICA_REQUEST
          - OTHERTCP_REQUEST

          example: REQUEST
