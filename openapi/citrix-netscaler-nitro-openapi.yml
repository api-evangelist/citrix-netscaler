        actsvcs:
          type: number
          description: >-
            Number of active (UP) services.
          example: 42.5
        inactsvcs:
          type: number
          description: >-
            Number of inactive (DOWN) services.
          example: 42.5
        tothits:
          type: number
          description: >-
            Total number of virtual server hits since last restart.
          example: 42.5
        hitsrate:
          type: number
          description: >-
            Rate of hits per second.
          example: 42.5
        totalrequests:
          type: number
          description: >-
            Total number of requests received.
          example: 42.5
        requestsrate:
          type: number
          description: >-
            Rate of requests per second.
          example: 42.5
        totalresponses:
          type: number
          description: >-
            Total number of responses sent.
          example: 42.5
        responsesrate:
          type: number
          description: >-
            Rate of responses per second.
          example: 42.5
        totalrequestbytes:
          type: number
          description: >-
            Total number of request bytes received.
          example: 42.5
        requestbytesrate:
          type: number
          description: >-
            Rate of request bytes per second.
          example: 42.5
        totalresponsebytes:
          type: number
          description: >-
            Total number of response bytes sent.
          example: 42.5
        responsebytesrate:
          type: number
          description: >-
            Rate of response bytes per second.
          example: 42.5
        totalpktsrecvd:
          type: number
          description: >-
            Total packets received.
          example: 42.5
        pktsrecvdrate:
          type: number
          description: >-
            Rate of packets received per second.
          example: 42.5
        totalpktssent:
          type: number
          description: >-
            Total packets sent.
          example: 42.5
        pktssentrate:
          type: number
          description: >-
            Rate of packets sent per second.
          example: 42.5
        totalsvrbusyerr:
          type: number
          description: >-
            Total server busy errors.
          example: 42.5
        svrbusyerrrate:
          type: number
          description: >-
            Rate of server busy errors per second.
          example: 42.5
        surgecount:
          type: number
          description: >-
            Number of requests in the surge queue.
          example: 42.5
        totspillovers:
          type: number
          description: >-
            Total number of spillover events.
          example: 42.5
        totvserverdownbackuphits:
          type: number
          description: >-
            Total diversions to the backup virtual server.
          example: 42.5
        avgcltttlb:
          type: number
          description: >-
            Average client time-to-last-byte in microseconds.
          example: 42.5
        cltresponsetimeapdex:
          type: number
          description: >-
            APDEX score based on client response times (0.0-1.0).
          example: 42.5
        cpuusagepm:
          type: number
