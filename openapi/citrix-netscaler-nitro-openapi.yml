          example: 42.5
        reqretrycountexceeded:
          type: number
          description: >-
            Times retry count was exceeded.
          example: 42.5
        deferredreq:
          type: number
          description: >-
            Number of deferred requests.
          example: 42.5
        deferredreqrate:
          type: number
          description: >-
            Rate of deferred requests per second.

          example: 42.5
